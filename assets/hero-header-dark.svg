<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 188" width="1000" height="188" role="img" aria-label="热情的 GitHub 主页顶部卡片">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121d33" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="65%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#f3ca6b" />
    </linearGradient>
    <radialGradient id="glowB" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowG" cx="86%" cy="76%" r="42%">
      <stop offset="0%" stop-color="#f3ca6b" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f3ca6b" stop-opacity="0" />
    </radialGradient>
    <clipPath id="clipCard">
      <rect x="1" y="1" width="998" height="186" rx="18" />
    </clipPath>
  </defs>
  
  <style>
    .sans { font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', 'SFMono-Regular', monospace; }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes traceDash {
      from { stroke-dashoffset: 64; }
      to { stroke-dashoffset: 0; }
    }
    .anim-pulse { animation: pulseGlow 3.2s ease-in-out infinite; }
    .anim-dash { stroke-dasharray: 8 8; animation: traceDash 4s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .anim-pulse, .anim-dash { animation: none; }
    }
  </style>
  <rect x="1" y="1" width="998" height="186" rx="18" fill="url(#bg)" stroke="#253d63" stroke-width="1.5" />
  <g clip-path="url(#clipCard)">
    <rect x="1" y="1" width="998" height="186" fill="url(#glowB)" />
    <rect x="1" y="1" width="998" height="186" fill="url(#glowG)" />
    <!-- Top accent rim -->
    <rect x="28" y="1" width="944" height="3" fill="url(#accentGrad)" opacity="0.85" />
    <!-- Morning mist orbital arc -->
    <path d="M -20,164 Q 320,18 690,118 T 1030,68" fill="none" stroke="#1d3b66" stroke-width="1.4" opacity="0.7" />
    <path d="M 120,192 Q 490,78 960,152" fill="none" stroke="#1d3b66" stroke-width="1" opacity="0.5" />
    <!-- Decorative PCB traces on right side -->
    <path d="M 620,152 L 690,152 L 714,128 L 764,128" fill="none" stroke="#1d3b66" stroke-width="1.5" />
    <path d="M 650,38 L 724,38 L 748,62 L 790,62" fill="none" stroke="#1d3b66" stroke-width="1.5" />
    <path d="M 880,62 L 928,62 L 948,42 L 998,42" fill="none" stroke="#1d3b66" stroke-width="1.5" />
    <path d="M 880,128 L 934,128 L 952,146 L 998,146" fill="none" stroke="#1d3b66" stroke-width="1.5" />
    <circle cx="620" cy="152" r="3" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="650" cy="38" r="3" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Right orbital ring + MCU artwork -->
    <circle cx="832" cy="94" r="74" fill="none" stroke="#1d3b66" stroke-width="1.2" stroke-dasharray="4 6" />
    <!-- Oscilloscope pulse trace -->
    <path d="M 616,94 L 702,94 L 714,70 L 726,118 L 736,94 L 788,94" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 876,94 L 906,94 L 916,74 L 928,114 L 938,94 L 992,94" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
