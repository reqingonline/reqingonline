  <!-- Left content -->
  <g>
    <rect x="40" y="28" width="374" height="26" rx="13" fill="#162947" stroke="#2c4c7a" stroke-width="1" />
    <circle cx="58" cy="41" r="4" fill="#f3ca6b" />
    <text x="72" y="45" class="mono" font-size="11.2" font-weight="700" letter-spacing="0.85" fill="#93c5fd">HARDWARE ENGINEER · EMBEDDED × SOFTWARE</text>
    <text x="40" y="99" class="sans" font-size="33" font-weight="700" letter-spacing="0.5" fill="#f0f6fc">你好，这里是热情。</text>
    <text x="40" y="133" class="sans" font-size="15" font-weight="500" fill="#a8bacf">画电路，也写代码 · 把低压嵌入式硬件和软件小工具串在一起</text>
    <!-- Bottom status line -->
    <circle cx="46" cy="161" r="4" fill="#34d399" class="anim-pulse" />
    <text x="58" y="165" class="mono" font-size="11.5" font-weight="600" letter-spacing="0.5" fill="#7d92ab">PWR 3V3 · SWD READY · 长期折腾中</text>
