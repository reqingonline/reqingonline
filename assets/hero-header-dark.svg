    <!-- MCU QFN package -->
    <line x1="812" y1="52" x2="812" y2="62" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="812" y1="126" x2="812" y2="136" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="790" y1="74" x2="800" y2="74" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="864" y1="74" x2="874" y2="74" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="822" y1="52" x2="822" y2="62" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="822" y1="126" x2="822" y2="136" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="790" y1="84" x2="800" y2="84" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="864" y1="84" x2="874" y2="84" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="832" y1="52" x2="832" y2="62" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="832" y1="126" x2="832" y2="136" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="790" y1="94" x2="800" y2="94" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="864" y1="94" x2="874" y2="94" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="842" y1="52" x2="842" y2="62" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="842" y1="126" x2="842" y2="136" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="790" y1="104" x2="800" y2="104" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="864" y1="104" x2="874" y2="104" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="852" y1="52" x2="852" y2="62" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="852" y1="126" x2="852" y2="136" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="790" y1="114" x2="800" y2="114" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="864" y1="114" x2="874" y2="114" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <rect x="800" y="62" width="64" height="64" rx="10" fill="#0d1628" stroke="#60a5fa" stroke-width="1.8" />
    <rect x="809" y="71" width="46" height="46" rx="6" fill="#162846" stroke="#1d3b66" stroke-width="1.2" />
    <circle cx="814" cy="76" r="2.2" fill="#f3ca6b" />
    <path d="M 832,81 Q 835.64,90.36 845,94 Q 835.64,97.64 832,107 Q 828.36,97.64 819,94 Q 828.36,90.36 832,81 Z" fill="#7dd3fc" opacity="0.95" class="anim-pulse" />
    <path d="M 832,87.5 Q 833.82,92.18 838.5,94 Q 833.82,95.82 832,100.5 Q 830.18,95.82 825.5,94 Q 830.18,92.18 832,87.5 Z" fill="#f3ca6b" opacity="0.95" />
    <!-- Floating sparkles -->
    <path d="M 710,37 Q 711.96,42.04 717,44 Q 711.96,45.96 710,51 Q 708.04,45.96 703,44 Q 708.04,42.04 710,37 Z" fill="#f3ca6b" opacity="0.88" class="anim-pulse" />
    <path d="M 938,126 Q 939.68,130.32 944,132 Q 939.68,133.68 938,138 Q 936.32,133.68 932,132 Q 936.32,130.32 938,126 Z" fill="#fde293" opacity="0.8" class="anim-pulse" />
    <path d="M 662,131.5 Q 663.26,134.74 666.5,136 Q 663.26,137.26 662,140.5 Q 660.74,137.26 657.5,136 Q 660.74,134.74 662,131.5 Z" fill="#7dd3fc" opacity="0.7" />
    <path d="M 944,43 Q 945.4,46.6 949,48 Q 945.4,49.4 944,53 Q 942.6,49.4 939,48 Q 942.6,46.6 944,43 Z" fill="#60a5fa" opacity="0.65" />
