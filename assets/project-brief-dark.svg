<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 104" width="1000" height="104" role="img" aria-label="daily-brief-agent 项目卡片">
  <defs>
    <linearGradient id="rbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121d33" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="rcta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <clipPath id="rclip">
      <rect x="1" y="2" width="998" height="100" rx="16" />
    </clipPath>
  </defs>
  
  <style>
    .sans { font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', 'SFMono-Regular', monospace; }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes traceDash {
      from { stroke-dashoffset: 64; }
      to { stroke-dashoffset: 0; }
    }
    .anim-pulse { animation: pulseGlow 3.2s ease-in-out infinite; }
    .anim-dash { stroke-dasharray: 8 8; animation: traceDash 4s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .anim-pulse, .anim-dash { animation: none; }
    }
  </style>
  <rect x="1" y="2" width="998" height="100" rx="16" fill="url(#rbg)" stroke="#253d63" stroke-width="1.4" />
  <g clip-path="url(#rclip)">
    <path d="M 650,82 L 700,82 L 712,68 L 722,92 L 732,82 L 795,82" fill="none" stroke="#1d3b66" stroke-width="1.4" opacity="0.7" />
    <path d="M 776,24.5 Q 777.54,28.46 781.5,30 Q 777.54,31.54 776,35.5 Q 774.46,31.54 770.5,30 Q 774.46,28.46 776,24.5 Z" fill="#f3ca6b" opacity="0.7" />
  </g>
  <!-- Brief icon -->
  <rect x="24" y="26" width="52" height="52" rx="13" fill="#162947" stroke="#2c4c7a" stroke-width="1.2" />
  <rect x="37" y="38" width="26" height="28" rx="4" fill="none" stroke="#60a5fa" stroke-width="1.8" />
  <line x1="42" y1="46" x2="58" y2="46" stroke="#f3ca6b" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="52" x2="58" y2="52" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" />
  <line x1="42" y1="58" x2="52" y2="58" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" />
  <!-- Copy & badges -->
  <text x="94" y="43" class="mono" font-size="19.5" font-weight="700" fill="#f0f6fc">daily-brief-agent</text>
  <rect x="322" y="25" width="70" height="22" rx="11" fill="#162947" stroke="#2c4c7a" stroke-width="1" />
  <text x="357" y="40" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#93c5fd">Python</text>
  <rect x="400" y="25" width="102" height="22" rx="11" fill="#14223a" stroke="#2a4570" stroke-width="1" />
  <text x="451" y="40" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#d6e7ff">Automation</text>
  <rect x="510" y="25" width="92" height="22" rx="11" fill="#241b0c" stroke="#7c5d22" stroke-width="1" />
  <circle cx="525" cy="36" r="3.2" fill="#34d399" class="anim-pulse" />
  <text x="562" y="40" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#fcd34d">早晚双更</text>
  <text x="94" y="73" class="sans" font-size="13.5" font-weight="500" fill="#a8bacf">早晚定时运行的中文全球新闻与市场简报流水线 —— 多信源采集、去重、校验与邮件投递</text>
  <!-- CTA -->
  <rect x="816" y="32" width="154" height="40" rx="20" fill="url(#rcta)" />
  <text x="893" y="57" text-anchor="middle" class="mono" font-size="13.5" font-weight="700" fill="#f8fafc">View Repo →</text>
</svg>